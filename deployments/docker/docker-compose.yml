services:
  postgres:
    image: postgres:16-alpine
    container_name: sigif-postgres
    environment:
      POSTGRES_USER: sigif
      POSTGRES_PASSWORD: sigif
      POSTGRES_DB: sigif
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../docker/init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigif -d sigif"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sigif-network

  redis:
    image: redis:7-alpine
    container_name: sigif-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sigif-network

  app:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    container_name: sigif-app
    environment:
      - SIGIF_APP_ENV=development
      - SIGIF_APP_PORT=4500
      - SIGIF_DATABASE_HOST=postgres
      - SIGIF_DATABASE_PORT=5432
      - SIGIF_DATABASE_USER=sigif
      - SIGIF_DATABASE_PASSWORD=sigif
      - SIGIF_DATABASE_NAME=sigif
      - SIGIF_DATABASE_SSL_MODE=disable
      - SIGIF_REDIS_HOST=redis
      - SIGIF_REDIS_PORT=6379
      - SIGIF_JWT_SECRET=your-super-secret-jwt-key-change-in-production
    ports:
      - "4500:4500"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sigif-network
    volumes:
      - ../../configs:/app/configs

  migrate:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.migrate
    container_name: sigif-migrate
    environment:
      - SIGIF_DATABASE_HOST=postgres
      - SIGIF_DATABASE_PORT=5432
      - SIGIF_DATABASE_USER=sigif
      - SIGIF_DATABASE_PASSWORD=sigif
      - SIGIF_DATABASE_NAME=sigif
      - SIGIF_DATABASE_SSL_MODE=disable
      - SIGIF_SEED_ADMIN_EMAIL=admin@sigif.com
      - SIGIF_SEED_ADMIN_PASSWORD=admin123
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sigif-network
    volumes:
      - ../../configs:/app/configs

volumes:
  postgres_data:
  redis_data:

networks:
  sigif-network:
    driver: bridge